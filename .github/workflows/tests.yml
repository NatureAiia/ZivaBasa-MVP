# Backend integration test suite (Day 13). Runs FastAPI's TestClient against the models/
# processed-features artifacts already checked into backend/models + backend/data/processed —
# no retraining needed, so this is fast enough to run on every push/PR (unlike
# scheduled-retrain.yml, which does the full train-and-promote cycle on a weekly cron).
name: Backend tests

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run pytest with coverage
        run: pytest --cov=api --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
