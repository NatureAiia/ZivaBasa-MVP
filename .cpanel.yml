---
deployment:
  tasks:
    # --- Frontend ---
    - cd /home/uat/repositories/ZivaBasa-MVP/frontend && npm install --no-audit --no-fund
    # No :port here — the backend is reached at the plain https://<subdomain>/ origin, proxied
    # by Apache (frontend/public/.htaccess) to 127.0.0.1:8002. See ecosystem.config.cjs's header
    # comment for the port history on this shared VPS.
    - cd /home/uat/repositories/ZivaBasa-MVP/frontend && VITE_API_BASE=https://diplomatic-onyx-antelope.172-93-106-10.cpanel.site /usr/bin/node node_modules/vite/bin/vite.js build --outDir /home/uat/public_html --emptyOutDir

    # --- Backend deps (serving-only, no torch/transformers/chronos) ---
    - cd /home/uat/repositories/ZivaBasa-MVP/backend && venv/bin/pip install --no-cache-dir -r requirements-serving.txt

    # --- DB migrations ---
    - cd /home/uat/repositories/ZivaBasa-MVP/backend && venv/bin/alembic upgrade head

    # --- Restart backend (port 8002 — see ecosystem.config.cjs's header comment) ---
    - cd /home/uat/repositories/ZivaBasa-MVP/backend && /usr/local/bin/pm2 startOrReload ecosystem.config.cjs --update-env && /usr/local/bin/pm2 save

    # --- Clear nginx cache ---
    - /usr/bin/uapi NginxCaching clear_cache
