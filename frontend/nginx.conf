# Serves the built SPA with client-side routing support (react-router-dom) — any path that
# isn't a real static file falls back to index.html instead of nginx's default 404.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
