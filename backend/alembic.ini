[alembic]
script_location = alembic
prepend_sys_path = .

# sqlalchemy.url is intentionally NOT set here — alembic/env.py reads DATABASE_URL from the
# environment (same variable api/db/session.py uses) so one env var configures both the app and
# migrations, instead of keeping two copies of a connection string in sync.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
