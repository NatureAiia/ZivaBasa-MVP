[project]
name = "zivabasa-backend"
version = "0.1.0"
description = "ZivaBasa MVP backend — FastAPI serving + TensorFlow/Keras multi-task models."
requires-python = ">=3.12,<3.13"

dependencies = [
    # Core data handling
    "pandas==2.2.2",
    "numpy==1.26.4",
    "pyarrow==15.0.2", # required by pandas for read_parquet/to_parquet (src/features.py) — was
                        # previously undeclared and only worked by accident via mlflow's own
                        # transitive dependency on it

    # Deep learning
    "tensorflow==2.16.1",
    "protobuf==4.25.9", # pinned explicitly — tensorflow/tensorboard/mlflow all need protobuf<5;
                         # flwr (below) would otherwise pull in protobuf 6.x and break the TF stack

    # Federated learning simulation (Phase 4 spike — src/federated/). Historically installed as
    # `pip install flwr "protobuf==4.25.9"` to force an older flwr (1.23.0) compatible with the
    # pinned protobuf. Left declared plainly here — uv's whole-graph resolver picks a compatible
    # flwr version against the protobuf pin above without needing that manual two-step.
    "flwr==1.23.0",

    # Causal/uplift layer (demo-readiness Phase B — src/uplift.py). EconML chosen over CausalML:
    # it installs cleanly against this project's pinned numpy, CausalML has a heavier/more
    # fragile build chain.
    "econml==0.16.0",

    # Classical ML baselines
    "scikit-learn==1.5.0",
    "xgboost==2.0.3",

    # Explainability
    "shap==0.45.1",

    # LIME — 2nd explainer alongside SHAP (src/evaluate.py::compute_lime_values()), for a
    # SHAP/LIME agreement signal on ShapLedger.jsx. Historically installed with --no-deps
    # because a plain `pip install lime` resolves its unpinned "numpy" dependency to numpy>=2.0,
    # breaking the tensorflow==2.16.1/Keras-3 numpy<2.0 ceiling — lime's scikit-image>=0.12
    # dependency is only used by its (unused here) lime_image module; verified
    # `from lime.lime_tabular import LimeTabularExplainer` imports cleanly without it.
    "lime==0.2.0.1",

    # Causal-consistent XAI (Phase 3 spike — src/causal_xai.py). Historically installed with
    # --no-deps + hand-picked transitive deps (pydot/graphviz/momentchi2/statsmodels) for the
    # same numpy<2.0-ceiling reason as lime above. dowhy itself was skipped entirely (pulls in
    # cvxpy/numba, more numpy-version risk) — see causal_xai.py's do-calculus section for the
    # lighter substitute.
    "causal-learn==0.1.4.8",
    "networkx==3.6.1",
    "pydot==4.0.1",
    "graphviz==0.21",
    "momentchi2==0.1.8",
    "statsmodels==0.14.6",

    # Experiment tracking
    "mlflow==2.14.1",
    # PINNED, NOT INCIDENTAL: mlflow==2.14.1 (2024) still hard-imports the legacy
    # `pkg_resources` API (mlflow/utils/requirements_utils.py), which setuptools stopped
    # bundling as of its own deprecation timeline. Without this pin, the resolver picks the
    # newest setuptools and `import mlflow` raises `ModuleNotFoundError: No module named
    # 'pkg_resources'` — discovered during the uv migration: this was ALREADY silently broken
    # in the pre-uv environment too (verified independently), just never surfaced because
    # every mlflow-logging call site in this codebase (evaluate.py, model.py, ple_model.py,
    # scripts/benchmark_ple_vs_baseline.py, scripts/train_ple_multitask.py) wraps `import
    # mlflow` in `except ImportError` — and ModuleNotFoundError IS an ImportError subclass, so
    # "mlflow is broken" was silently swallowed as "mlflow is absent (fine, skip logging)".
    "setuptools<81",

    # Visualization / reporting
    "matplotlib==3.9.0",
    "markdown==3.10.2",
    "python-docx==1.2.0",
    "reportlab==4.2.2",
    "openpyxl==3.1.5", # Excel (.xlsx) report export — reports.py's xlsx sibling of the docx/pdf builders
    "seaborn==0.13.2",
    "beautifulsoup4==4.15.0",

    # Notebook environment
    "jupyter==1.0.0",
    "ipykernel==6.29.4",

    # Utilities
    "joblib==1.4.2",
    "python-dotenv==1.0.1",

    # API layer (Day 8 — Workforce Intelligence API)
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.13.4", # bumped from 2.7.4 — langchain-core (below) requires pydantic-core
                         # 2.46.4, which isn't compatible with pydantic 2.7.4's pinned
                         # pydantic-core 2.18.4. Verified against fastapi==0.111.0 (supports
                         # pydantic v2 broadly, <3.0.0).
    "python-multipart==0.0.9", # required by FastAPI's UploadFile/File() — used by the batch CSV
                                # upload endpoint (/predict/batch/{task})
    "httpx==0.27.0", # async HTTP client used by api/chat.py and src/worldbank.py

    # "Chiedza" agent mode (api/agent_graph.py) — a LangGraph-powered agent added as a parallel
    # capability alongside api/chat.py's hand-rolled multi-provider loop. Optional/off-by-default:
    # if these three aren't importable, api/agent_graph.py's _LANGGRAPH_AVAILABLE flag stays
    # False and POST /chat/agent returns a 503 instead of failing API startup.
    #
    # RANGE, NOT AN EXACT PIN, DELIBERATELY: langchain-core was previously hard-pinned to
    # ==0.3.28, which is actually INCOMPATIBLE with langchain-anthropic==0.3.4's own
    # requirement of langchain-core>=0.3.31 — a real, previously-undetected conflict (a plain
    # sequential `pip install -r requirements.txt` surfaced it: "ResolutionImpossible"). This
    # range lets uv's whole-graph resolver pick a version that actually satisfies both
    # langgraph==0.2.60 (langchain-core>=0.2.43,<0.4.0, excluding several 0.3.x patches) and
    # langchain-anthropic==0.3.4 (langchain-core>=0.3.31,<0.4.0) at once — the exact resolved
    # version is pinned in requirements.lock.txt, not left floating at install time.
    "langgraph==0.2.60",
    "langchain-core>=0.3.31,<0.4.0",
    "langchain-anthropic==0.3.4",

    # Self-hosted persistence + auth (replaces Supabase — see backend/api/db/ and
    # backend/api/auth_service.py). asyncpg is the async Postgres driver SQLAlchemy's asyncio
    # engine uses; alembic manages schema migrations against DATABASE_URL.
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10", # sync driver alembic/env.py swaps in for migrations (asyncpg has
                                # no sync engine; the app itself keeps using +asyncpg at runtime)
    "alembic==1.14.0",
    "passlib[bcrypt]==1.7.4",
    # PINNED, NOT INCIDENTAL: passlib[bcrypt]'s unpinned bcrypt dependency resolves to the
    # latest bcrypt (5.x as of this writing), which breaks passlib 1.7.4's own internal
    # self-test (bcrypt.handlers.detect_wrap_bug) with `ValueError: password cannot be longer
    # than 72 bytes` on EVERY hash_password()/verify_password() call, including signup/login --
    # a widely-known passlib-1.7.4/bcrypt-4.1+ incompatibility. 4.0.1 is the last version
    # confirmed compatible; verified end-to-end (POST /auth/signup, /auth/login both 200) after
    # downgrading from the auto-resolved 5.0.0.
    "bcrypt==4.0.1",
    "pyjwt==2.10.1",
    "email-validator==2.2.0", # required by pydantic's EmailStr (api/auth_routes.py's signup/login bodies)

    # Testing (Day 13 — integration/end-to-end suite, backend/tests/)
    "pytest==8.2.2",
    "pytest-cov==5.0.0",
]

[project.optional-dependencies]
# Zero-shot forecasting (src/chronos_forecast.py) — cold-start fallback used only when a time
# series doesn't yet have enough observed points to train src/forecast.py's LSTM/GRU or
# src/tsmixer_forecast.py's TSMixer heads. Kept as an explicit extra, NOT a base dependency:
# torch is a large, slow download (confirmed this session — 122MB wheel, multi-minute even on
# a good connection) that nothing in the served API (api/main.py) depends on. Install with
# `uv pip sync requirements.lock.txt requirements-forecasting.lock.txt` when doing TSMixer/
# Chronos work; CI and the served Docker image never install this extra.
#
# Verified (2026-07-29): no numpy/protobuf/tensorflow regression from adding this stack. One
# resolver-flagged conflict surfaced — huggingface-hub (pulled in by transformers) requires
# click>=8.4.2, while flwr==1.23.0's metadata pins click<8.2.0 — but flwr actually imports and
# tests/test_federated.py passes cleanly under click==8.4.2, so that pin is conservative
# packaging metadata, not a real runtime incompatibility. Do not downgrade click to "fix" the
# resolver warning if it resurfaces.
forecasting = [
    "torch",
    "chronos-forecasting",
    "transformers",
]

[tool.uv]
# NOTE: Puter.js (the free/keyless DeepSeek chat option) is a frontend-only <script> include
# (https://js.puter.com/v2/), not a Python package — see frontend/src/lib/puter.js.
